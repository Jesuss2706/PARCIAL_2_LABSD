spring.application.name=servidor-reacciones
server.port=5000

# ---------- Directorio Consul ----------
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.service-name=servidor-reacciones
spring.cloud.consul.discovery.instance-id=servidor-reacciones-127.0.0.1-5000
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.ip-address=127.0.0.1
# Consul corre en Docker y no puede hacer "ping" a localhost de Windows:
# en vez de un health-check HTTP, el servicio envía latidos (TTL) igual que los servidores en Go.
spring.cloud.consul.discovery.heartbeat.enabled=true
spring.cloud.consul.discovery.heartbeat.ttl=15s
spring.cloud.consul.discovery.health-check-critical-timeout=1m

# Secreto que agrega el API Gateway (cabecera X-Gateway-Token)
gateway.secreto=${GATEWAY_SECRET:secreto-gateway-2026}

management.endpoints.web.exposure.include=health
