spring.application.name=servidor-reacciones

# Puerto del microservicio (se puede cambiar con la variable de entorno PUERTO)
server.port=${PUERTO:8085}

# Directorio Consul: el servicio se registra al iniciar y renueva su TTL cada 5 s
consul.direccion=${CONSUL_ADDR:127.0.0.1:8500}
consul.host-servicio=${SERVICE_HOST:127.0.0.1}

# Solo se aceptan peticiones que vengan del API Gateway (cabecera X-Gateway-Token)
gateway.secreto=${GATEWAY_SECRET:secreto-gateway-2026}
gateway.exigir-token=${EXIGIR_GATEWAY:true}

management.endpoints.web.exposure.include=health
